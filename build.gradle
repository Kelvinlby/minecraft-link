plugins {
	id 'base'
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

allprojects {
	version = project.mod_version
	group = project.maven_group
}

tasks.register('buildCore') {
	group = 'build'
	description = 'Build only the Open Crafter Link core mod.'
	dependsOn ':ocl-core:build'
}

tasks.register('buildRecorder') {
	group = 'build'
	description = 'Build only the dataset recorder mod (and the core classes it depends on).'
	dependsOn ':ocl-recorder:build'
}

tasks.register('collectModJars', Sync) {
	group = 'build'
	description = 'Collect both remapped distributable mod jars under build/libs.'
	dependsOn ':ocl-core:remapJar', ':ocl-recorder:remapJar'
	from(project(':ocl-core').tasks.named('remapJar').flatMap { it.archiveFile })
	from(project(':ocl-recorder').tasks.named('remapJar').flatMap { it.archiveFile })
	into layout.buildDirectory.dir('libs')
}

tasks.named('clean') {
	dependsOn ':ocl-core:clean', ':ocl-recorder:clean'
}

tasks.named('build') {
	dependsOn 'buildCore', 'buildRecorder', 'collectModJars'
}

tasks.register('run') {
	group = 'fabric'
	description = 'Run a Minecraft client with both OCL core and the recorder loaded.'
	dependsOn ':ocl-recorder:runClient'
}

tasks.register('runCore') {
	group = 'fabric'
	description = 'Run a Minecraft client with only OCL core loaded.'
	dependsOn ':ocl-core:runClient'
}

tasks.register('genGolden') {
	group = 'verification'
	description = 'Regenerate shared protocol golden vectors.'
	dependsOn ':ocl-core:genGolden'
}
